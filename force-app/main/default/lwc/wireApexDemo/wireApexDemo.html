<template>
<lightning-card title="Wire Apex Demo" icon-name="custom:custom14">
    <ul class="slds-m-around_medium">
        <template if:true={record.data}>
        <lightning-formatted-text value={name} class="slds-text-heading_large">
        </lightning-formatted-text>
        </template>
            <template for:each={contacts} for:item="contact">
                <li key={contact.Id}>  
                    {contact.Name}
                </li>
            </template>
        <template if:true={error}>
            <p class="slds-text-color_error">Error loading contacts: {contacts.error}</p>
        </template>
    </ul>
</lightning-card>
</template>
